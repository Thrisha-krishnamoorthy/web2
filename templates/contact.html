<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .success-message {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e8e8e8;
        }
        .success-message i {
            font-size: 60px;
            color: #2ecc71;
            margin-bottom: 20px;
        }
        h1 {
            color: #2ecc71;
            margin: 20px 0;
        }
        .contact-info {
            margin: 30px 0;
        }
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .info-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }
        .info-item i {
            font-size: 24px;
            color: #3498db;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }
        .info-content h3 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .info-content p {
            margin: 0;
            color: #666;
        }
        .back-to-home {
            text-align: center;
            margin-top: 40px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn i {
            margin-right: 8px;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            .success-message i {
                font-size: 50px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-message">
            <i class="fas fa-check-circle"></i>
            <h1>Payment Successful!</h1>
            <p>Thank you for your purchase. Our team will contact you shortly with the next steps.</p>
        </div>
        
        <div class="contact-info">
            <h2>Contact Information</h2>
            <div class="info-item">
                <i class="fas fa-phone"></i>
                <div class="info-content">
                    <h3>Phone</h3>
                    <p>+1 (555) 123-4567</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <div class="info-content">
                    <h3>Email</h3>
                    <p>support@example.com</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fas fa-clock"></i>
                <div class="info-content">
                    <h3>Business Hours</h3>
                    <p>Monday - Friday: 9:00 AM - 6:00 PM</p>
                </div>
            </div>
        </div>
        
        <div class="back-to-home">
            <a href="{{ url_for('home') }}" class="btn">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
