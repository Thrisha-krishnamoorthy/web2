<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Product Catalog</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 60px;
        }

        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input[type="file"] {
            padding: 10px;
            margin: 20px 0;
        }

        button {
            padding: 10px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .nav-bar {
            margin-bottom: 30px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin: 0 10px;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Upload Product Catalog </h1>

    <div class="upload-box">
<form action="/upload" method="post" enctype="multipart/form-data">
    

    <label>Upload PDF Files (Multiple):</label><br>
    <input type="file" name="pdf_file" accept=".pdf" multiple required><br><br>



    <label>Upload Excel File (.xlsx or .xls):</label><br>
    <input type="file" name="excel_file" accept=".xlsx,.xls" required><br><br>

    <button type="submit">Upload</button>
</form>

    </div>
</body>
</html>
