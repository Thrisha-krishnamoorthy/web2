<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Options</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00bcd4;
            --secondary: #7b1fa2;
            --hover-primary: #0097a7;
            --hover-secondary: #6a1b9a;
            --text-dark: #1b2e4b;
            --bg-gradient: linear-gradient(135deg, #e0f7fa, #fce4ec);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        .option-box {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .option-box:hover {
            transform: scale(1.015);
        }

        .option-box h2 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 30px;
        }

        .option-btn {
            display: block;
            margin: 18px auto;
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            width: 260px;
            font-weight: 600;
            transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 188, 212, 0.15);
        }

        .option-btn:hover {
            background: linear-gradient(135deg, var(--hover-primary), var(--hover-secondary));
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 188, 212, 0.3);
        }

        @media (max-width: 480px) {
            .option-box {
                width: 100%;
                padding: 30px 20px;
            }

            .option-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="option-box">
        <h2>Greetings, Seller!</h2>
        <p style="margin-bottom: 30px; color: #555; font-size: 16px;">Ready to showcase your products? Upload new items or manage your existing catalog with ease</p>

        <a href="/upload-pdf" class="option-btn">📄 Upload pdf and excel</a>
        <a href="/upload_excel" class="option-btn">📄 Upload excel only</a>
        <a href="/product-catalog" class="option-btn">📋 Product Catalog</a>
    </div>

</body>
</html>
