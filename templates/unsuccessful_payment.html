<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Unsuccessful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }
        .error-icon {
            font-size: 80px;
            color: #e74c3c;
            margin-bottom: 20px;
        }
        h1 {
            color: #e74c3c;
            margin: 20px 0;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn i {
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .try-again {
            margin-top: 20px;
        }
        .try-again a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }
        .try-again a:hover {
            text-decoration: underline;
        }
        .try-again i {
            margin-right: 5px;
        }
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .error-icon {
                font-size: 60px;
            }
            h1 {
                font-size: 24px;
            }
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        <h1>Payment Unsuccessful</h1>
        <p>We're sorry, but we couldn't process your payment. Please try again or contact support if the problem persists.</p>
        
        <a href="{{ url_for('product_page') }}" class="btn">
            <i class="fas fa-arrow-left"></i> Back to Products
        </a>
        
        <div class="try-again">
            <a href="{{ url_for('payment_decision') }}">
                <i class="fas fa-sync-alt"></i> Try Again
            </a>
        </div>
    </div>
</body>
</html>
