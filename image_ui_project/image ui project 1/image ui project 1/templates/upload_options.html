<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 60px;
        }

        .option-box {
            display: inline-block;
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .option-box h2 {
            margin-bottom: 25px;
        }

        .option-btn {
            display: block;
            margin: 15px auto;
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            width: 260px;
        }

        .option-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="option-box">
        <h2>Choose Upload Option</h2>

        <a href="/upload-pdf" class="option-btn">📄 Upload Only PDF</a>
        <a href="/upload-excel" class="option-btn">📊 Upload Only Excel</a>
        <a href="/upload" class="option-btn">📁 Upload PDF & Excel</a>
    </div>

</body>
</html>
