<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Product Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-block {
            margin-bottom: 40px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .image-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .image-box {
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: border 0.3s ease;
            width: 150px;
        }

        .image-box img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            background-color: #eee;
        }

        .image-box.selected {
            border: 3px solid #007bff;
        }

        input[type="radio"] {
            display: none;
        }

        .submit-btn {
            display: block;
            margin: 30px auto 0;
            padding: 12px 30px;
            background: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .skip-btn {
            font-size: 14px;
            padding: 6px 14px;
            background: #ccc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .skip-btn:hover {
            background-color: #999;
        }
    </style>
</head>
<body>

<h2>Select One Image per Product</h2>

<form method="POST" action="/select-images">
    {% for model, urls in image_options.items() %}
    <div class="product-block" id="block-{{ model }}">
        <div class="product-title">
            {{ model }}
            <button type="button" class="skip-btn" onclick="skipSelection('{{ model }}')">Skip</button>
        </div>
        <div class="image-options">
            {% for url in urls %}
            <label class="image-box">
                <input type="radio" name="{{ model }}" value="{{ url }}">
                <img src="{{ url }}" alt="Option for {{ model }}"
                     onerror="this.onerror=null;this.src='/static/default.jpg';">
            </label>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <button type="submit" class="submit-btn">✅ Submit Selections</button>
</form>

<script>
    // Highlight selected image visually
    const imageBoxes = document.querySelectorAll('.image-box');
    imageBoxes.forEach(box => {
        box.addEventListener('click', () => {
            const group = box.closest('.image-options');
            group.querySelectorAll('.image-box').forEach(b => b.classList.remove('selected'));
            box.classList.add('selected');
        });
    });

    // Skip functionality
    function skipSelection(model) {
        const radios = document.querySelectorAll(`input[name="${model}"]`);
        radios.forEach(r => r.checked = false);

        const group = document.querySelector(`#block-${model} .image-options`);
        if (group) {
            group.querySelectorAll('.image-box').forEach(box => box.classList.remove('selected'));
        }
    }
</script>

</body>
</html>
